"$schema" = 'https://starship.rs/config-schema.json'

add_newline = false
command_timeout = 1000
format = """\
$directory\
$git_branch\
$git_commit\
$git_state\
$git_status\
$fill\
$status\
$cmd_duration\
$nodejs\
$python\
$line_break\
$character
"""

[character]
success_symbol = '[ ❯](bold green)'
error_symbol = '[ ❯](bold red)'

[cmd_duration]
min_time = 5000

[directory]
format = ' [$path]($style)'

[fill]
symbol = '—'
style = 'bold dimmed black'

[git_branch]
symbol = " "
format = " [$symbol$branch(:$remote_branch)]($style) "

[git_status]
ahead = '⇡${count}'
behind = '⇣${count}'
diverged = '⇕⇡${ahead_count}⇣${behind_count}'
format = "([$all_status$ahead_behind]($style))"

[nodejs]
symbol = " "
format = '[\[$symbol($version)\]]($style)'
version_format = "${raw}"

[python]
format = '[\[$symbol($version)\]]($style)'
version_format = "${raw}"

[status]
disabled = false
map_symbol = true
